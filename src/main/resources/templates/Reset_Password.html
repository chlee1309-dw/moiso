<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/Id_Find.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="_csrf" th:content="${csrfToken}">
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body>

<div class="find-container">
    <a th:href="@{/}" class="top-back-btn" title="메인으로 돌아가기">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <img th:src="@{/images/cow.png}" src="/images/cow.png" class="logo-img" alt="모이소 캐릭터" onerror="this.src='https://cdn-icons-png.flaticon.com/512/847/847969.png'">

    <h1 class="title">새 비밀번호 설정</h1>
    <p class="sub-text">새로 사용할 비밀번호를 입력해 주세요.</p>

    <div th:if="${errorMessage}" class="flash flash--error" th:text="${errorMessage}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <input class="input-box" type="password" name="newPassword" placeholder="새 비밀번호 (8자 이상)"
               autocomplete="new-password" required>
        <input class="input-box" type="password" name="newPasswordConfirm" placeholder="새 비밀번호 확인"
               autocomplete="new-password" required>
        <button type="submit" class="submit-btn">비밀번호 변경</button>
    </form>

    <a th:href="@{/login}" class="back">로그인 화면으로 돌아가기</a>
</div>

</body>
</html>
