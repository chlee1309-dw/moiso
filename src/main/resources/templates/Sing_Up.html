<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모이소 회원가입</title>
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/Sing_Up.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="_csrf" th:content="${csrfToken}">
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body>
<div class="signup-container">

  <!-- 좌측 상단 뒤로가기 버튼 (메인으로 이동) -->
  <a th:href="@{/}" class="top-back-btn" title="메인으로 돌아가기">
    <i class="fa-solid fa-arrow-left"></i>
  </a>

  <!-- 로고 영역 -->
  <div class="logo-area">
    <img th:src="@{/images/cow.png}" src="/images/cow.png" alt="모이소 캐릭터" onerror="this.src='https://cdn-icons-png.flaticon.com/512/847/847969.png'">
  </div>

  <h1 class="title">모이소 회원가입</h1>

  <div th:if="${errorMessage}" class="flash flash--error" th:text="${errorMessage}"
       style="margin-bottom: 16px;"></div>

  <!-- 회원가입 폼 -->
  <form class="signup-form" id="signupForm" th:action="@{/signup}" method="post">

    <!-- 이름 입력 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-regular fa-id-card"></i>
      </div>
      <div class="label-box">이름</div>
      <input
              type="text"
              name="name"
              class="input-box"
              placeholder="이름을 입력하시오."
              maxlength="20"
              required>
    </div>

    <!-- 이메일 입력 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-regular fa-user"></i>
      </div>
      <div class="label-box">이메일</div>
      <input
              type="email"
              name="email"
              class="input-box"
              placeholder="이메일을 입력하시오."
              maxlength="50"
              required>
    </div>

    <!-- 비밀번호 입력 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="label-box">비밀번호</div>
      <input
              type="password"
              id="password"
              name="password"
              class="input-box"
              placeholder="비밀번호를 입력하시오. (8자 이상)"
              minlength="8"
              maxlength="64"
              required>
    </div>

    <!-- 비밀번호 확인 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="label-box">확인</div>
      <input
              type="password"
              id="passwordCheck"
              name="passwordConfirm"
              class="input-box"
              placeholder="비밀번호 확인"
              required>
    </div>

    <!-- 가입목적 선택 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-regular fa-circle-question"></i>
      </div>
      <div class="label-box">가입목적</div>
      <select name="purpose" class="select-box" required>
        <option value="" disabled selected hidden>가입목적을 선택하시오.</option>
        <option value="COUNSEL">고민상담 목적</option>
        <option value="SCHOOL">학교생활 목적</option>
        <option value="CAREER">취업/학업 목적</option>
      </select>
    </div>

    <!-- 학교 입력 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-solid fa-school"></i>
      </div>
      <div class="label-box">학교</div>
      <input
              type="text"
              name="university"
              class="input-box"
              placeholder="학교명을 입력하시오."
              maxlength="255"
              required>
    </div>

    <!-- 학과 입력 -->
    <div class="form-row">
      <div class="icon-box">
        <i class="fa-solid fa-book"></i>
      </div>
      <div class="label-box">학과</div>
      <input
              type="text"
              name="department"
              class="input-box"
              placeholder="학과를 입력하시오."
              maxlength="255"
              required>
    </div>

    <!-- 제출 버튼 -->
    <button type="submit" class="btn-submit">회원가입 완료</button>

  </form>
</div>
<script th:src="@{/js/Sing_Up.js}"></script>
</body>
</html>
