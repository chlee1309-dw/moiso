<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색</title>
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/Search.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
    <button type="button" class="back-btn" onclick="goBack()" title="뒤로 가기">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <a th:href="@{/main}" class="header-logo">
        <i class="fa-solid fa-cow"></i>
        <span>모이소</span>
    </a>
    <div class="header-icons">
        <a th:href="@{/profile}" class="icon-link"><i class="fa-regular fa-user"></i></a>
    </div>
</header>

<div class="container">
    <!-- 검색 입력 영역 -->
    <form id="searchForm" class="search-container" th:action="@{/questions}" method="get">
        <input type="text" id="searchBox" name="keyword" class="search-box"
               th:value="${keyword}" autocomplete="off"
               placeholder="검색어를 입력하고 Enter를 누르세요">
        <button type="button" id="clearBtn" class="clear-btn">✕</button>
    </form>

    <!-- 최근 검색어 영역 -->
    <div id="recentSection" class="recent-section">
        <h3 class="section-title">최근 검색어</h3>
        <div id="recentTags" class="recent-tags"></div>
    </div>

    <!-- 인기 검색어 영역 -->
    <div class="recommend-section" th:if="${!#lists.isEmpty(topKeywords)}">
        <h3 class="section-title">인기 검색어</h3>
        <div class="keyword-grid">
            <div class="keyword-item" th:each="k : ${topKeywords}" th:text="${k}">키워드</div>
        </div>
    </div>
</div>

<script th:src="@{/js/Search.js}"></script>
</body>
</html>
