<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/Profile.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="_csrf" th:content="${csrfToken}">
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body>
<!-- 0. 상단 헤더 -->
<header class="top-header">
    <a th:href="@{/profile}" class="header-left" title="마이페이지로"><i class="fa-solid fa-arrow-left"></i></a>
    <a th:href="@{/main}" class="header-logo">
        <img th:src="@{/images/cow.png}" src="/images/cow.png" alt="모이소 로고" onerror="this.style.display='none'">
        <span>모이소</span>
    </a>
</header>

<div class="app-container">
    <div class="main-content main-content--narrow">

        <div class="page-title">
            <div class="page-title-icon"><i class="fa-solid fa-lock"></i></div>
            <span>비밀번호 변경</span>
        </div>

        <div th:if="${message}" class="flash flash--info" th:text="${message}" style="margin-bottom:16px;"></div>
        <div th:if="${errorMessage}" class="flash flash--error" th:text="${errorMessage}" style="margin-bottom:16px;"></div>

        <form class="edit-form mypage-card" th:action="@{/password}" method="post">
            <label>현재 비밀번호
                <input type="password" name="currentPassword" required>
            </label>
            <label>새 비밀번호
                <input type="password" name="newPassword" minlength="8" maxlength="64" required>
            </label>
            <label>새 비밀번호 확인
                <input type="password" name="newPasswordConfirm" required>
            </label>
            <button type="submit" class="btn-user-action primary">비밀번호 변경</button>
        </form>

    </div>
</div>

</body>
</html>
