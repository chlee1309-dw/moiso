<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 신청</title>
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/Appointment.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="_csrf" th:content="${csrfToken}">
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body>
<header class="header">
    <a th:href="@{/appointments}" class="back-btn" title="예약 목록으로"><i class="fa-solid fa-arrow-left"></i></a>
    <a th:href="@{/main}" class="header-logo-group">
        <img th:src="@{/images/cow.png}" src="/images/cow.png" alt="모이소" onerror="this.style.display='none'">
        <span>모이소</span>
    </a>
    <span style="width:40px"></span>
</header>

<main class="container">
    <h1 class="page-heading">멘토링 예약 신청</h1>

    <div th:if="${errorMessage}" class="flash flash--error" th:text="${errorMessage}"></div>

    <form class="appt-form" id="apptForm" th:action="@{/appointments}" method="post">
        <label>멘토 회원 번호
            <input type="number" name="mentorIdx" th:value="${mentorIdx}" min="1"
                   placeholder="예: 2" required>
        </label>

        <label for="locationQuery">장소
            <input type="text" id="locationQuery" placeholder="장소를 검색하세요 (예: 중앙도서관)" autocomplete="off" required>
        </label>
        <input type="hidden" name="locationIdx" id="locationIdxInput">
        <p class="location-picked" id="locationPicked" hidden>
            <i class="fa-solid fa-location-dot"></i> <span id="locationPickedText"></span>
        </p>

        <div class="row">
            <label>날짜
                <input type="date" name="date" required>
            </label>
            <label>시간
                <input type="time" name="time" required>
            </label>
        </div>

        <button type="submit" id="apptSubmitBtn" disabled>예약 신청하기</button>
    </form>

    <section class="map-section" style="margin-top:24px;">
        <h2 class="page-heading">장소 검색 · 지도에서 선택</h2>
        <p class="map-hint">위 장소란에 검색어를 입력하거나, 아래에서 바로 검색해도 지도에 후보가 표시돼요. 지도에서 마커를 클릭하면 장소란에 자동으로 채워집니다.</p>
        <div class="map-search">
            <input type="text" id="mapKeyword" placeholder="지도에서 장소 검색">
            <button type="button" id="mapSearchBtn">검색</button>
        </div>
        <div id="apptMap" class="appt-map"></div>
    </section>
</main>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=377b2cfffb4143e9fea6d31ded53c968&libraries=services"></script>
<script th:src="@{/js/AppointmentForm.js}"></script>
</body>
</html>
